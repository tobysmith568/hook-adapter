name: Continuous Integration
run-name: Continuous Integration for ${{ (inputs.version && format('v{0}', inputs.version)) || (github.event.pull_request.number && format('PR {0}', github.event.pull_request.number)) || github.ref_name }}

on:
  push:
    branches:
      - main
      - renovate/*
  pull_request:
    branches:
      - main
      - "!renovate/*"
  workflow_call:
    inputs:
      version:
        description: Version to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: true
        type: string

defaults:
  run:
    shell: pwsh

jobs:
  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Prettier
        run: bun x prettier --check .

      - name: Run ESLint
        run: bun x eslint . --max-warnings 0

  typecheck:
    name: Type Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun check

  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set Version
        run: bun pm version ${{ inputs.version }} --no-git-tag-version

      - name: Build
        run: bun run build

      - name: Pack
        run: bun pm pack --destination ./builds

      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: Build
          path: ./builds
          retention-days: 1
          if-no-files-found: error

  test:
    name: Unit Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun test

  licenses:
    name: Check Licenses

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Licenses
        run: bun x license-cop

  codeql:
    name: CodeQL

    uses: ./.github/workflows/codeql.yml

    secrets: inherit

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
